<!DOCTYPE html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Go-TV</title>
<style>
:root{--bg:#f3f5fb;--sf:#fff;--tx:#10162a;--mu:#6b7592;--ac:#4f7cff;--ln:#dde2f0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070d1c;--sf:rgba(16,27,52,.72);--tx:#eef2ff;--mu:#8a9bc2;--ac:#5b8cff;--ln:rgba(120,150,220,.16)}}
:root[data-theme="dark"]{--bg:#070d1c;--sf:rgba(16,27,52,.72);--tx:#eef2ff;--mu:#8a9bc2;--ac:#5b8cff;--ln:rgba(120,150,220,.16)}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:radial-gradient(900px 480px at 12% -8%,rgba(79,124,255,.22),transparent 65%) fixed,var(--bg);color:var(--tx);font:15px/1.5 "Inter",system-ui,sans-serif;overflow-x:hidden}
button,input{font:inherit;color:inherit}
#home{max-width:640px;margin:0 auto;padding:40px 20px}
h1{font-size:44px;letter-spacing:-.04em;margin:0}h1 b{color:var(--ac)}
.sub{color:var(--mu);margin:4px 0 28px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.big{background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:22px 16px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px;transition:border-color .15s,transform .15s}
.big:hover{border-color:var(--ac)}.big:active{transform:scale(.98)}
.big span{font-size:22px;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:rgba(91,140,255,.16)}.big em{font-style:normal;color:var(--mu);font-size:13px}
h2{font-size:15px;margin:32px 0 10px;color:var(--mu);font-weight:600}
.hist{display:flex;flex-direction:column;gap:8px}
.h{display:flex;align-items:center;gap:10px;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:10px 12px;cursor:pointer;text-align:left;width:100%}
.h:hover{border-color:var(--ac)}.h small{color:var(--mu);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.h div{flex:1;min-width:0}.tag{background:var(--ac);color:#fff;border-radius:8px;padding:2px 8px;font-size:12px}
.x{background:none;border:0;color:var(--mu);cursor:pointer;padding:4px 8px}
dialog{border:1px solid var(--ln);border-radius:18px;background:var(--sf);color:var(--tx);width:min(420px,92vw);padding:22px}
dialog::backdrop{background:#0008}
dialog input{width:100%;margin:6px 0 12px;padding:10px 12px;border-radius:10px;border:1px solid var(--ln);background:var(--bg)}
label{font-size:13px;color:var(--mu)}
.pri{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:10px 18px;cursor:pointer}
.gh{background:none;border:0;cursor:pointer;color:var(--mu);padding:10px}
#err{color:#e5484d;font-size:13px;min-height:20px;margin-top:8px}
#player{position:fixed;inset:0;background:#000;color:#fff;display:none;z-index:50;user-select:none}
#player.on{display:block}
video{width:100%;height:100%;object-fit:contain;background:#000}
#gest{position:absolute;inset:0;z-index:2}
#hud{max-width:80vw;text-align:center;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#000b;border-radius:14px;padding:10px 18px;z-index:6;display:none;font-size:18px;pointer-events:none}
#title{position:absolute;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 24px;background:linear-gradient(#000c,transparent);z-index:4;display:flex;justify-content:space-between;align-items:center;transition:opacity .2s}
#bar{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);z-index:4;display:flex;gap:6px;background:rgba(12,20,42,.78);border:1px solid rgba(130,160,230,.18);backdrop-filter:blur(18px);border-radius:20px;padding:8px;max-width:96vw;overflow-x:auto;transition:opacity .2s}
#bar button,#title button{background:none;border:0;color:#fff;font-size:15px;min-width:44px;height:44px;border-radius:14px;cursor:pointer}
#bar button:hover,#bar button.on{background:#ffffff22}#bar button.on{color:#ffd24d}
.hide{opacity:0;pointer-events:none}
.side{position:absolute;top:0;left:0;bottom:0;width:min(340px,86vw);background:#0a0e1af2;backdrop-filter:blur(16px);z-index:8;transform:translateX(-100%);transition:transform .25s;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.side.on{transform:none}
.side input{margin:12px;padding:10px 12px;border-radius:10px;border:1px solid #ffffff22;background:#ffffff12;color:#fff}
#lst{overflow-y:auto;flex:1}
.gr{width:100%;text-align:left;background:#ffffff10;border:0;color:#fff;padding:10px 14px;cursor:pointer;display:flex;justify-content:space-between;font-weight:600}
.ch{display:block;width:100%;text-align:left;background:none;border:0;color:#ffffffcc;padding:9px 14px 9px 24px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch:hover{background:#ffffff14}.ch.cur{color:var(--ac);font-weight:600}
#stat{padding:20px;display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:14px;align-content:start}#stat dt{color:#ffffff99}#stat dd{margin:0}
#fl{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:3}
#pp{background:var(--ac)!important}
#title{justify-content:space-between}
#bar{left:12px;right:12px;transform:none;max-width:none;flex-direction:column;gap:10px;padding:12px;overflow:visible}
#info{display:flex;align-items:center;gap:12px;min-width:0}
#info img{width:52px;height:52px;border-radius:14px;background:#ffffff1a;object-fit:contain;flex:none}
.im{min-width:0;flex:1}.im b{font-size:18px;margin:0 8px}
#epg{color:#c4d0ee;font-size:13px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#epg i{display:block;height:3px;border-radius:3px;background:#ffffff26;margin-top:6px}#epg u{display:block;height:100%;background:var(--ac);border-radius:3px}
#btns{display:flex;gap:6px;overflow-x:auto}
#btns button{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:68px;height:56px;font-size:16px;background:rgba(255,255,255,.07);border:1px solid rgba(130,160,230,.15)}
#btns button::after{content:attr(title);font-size:10px;opacity:.7}
#stage{position:absolute;inset:0;touch-action:none}
#btns #rc.on{color:#ff6b6b}
#dSave,#dSave input{user-select:text}
@media (orientation:portrait){
#player.on{display:flex;flex-direction:column}
#stage{position:relative;inset:auto;width:100%;aspect-ratio:16/9;flex:none}
#sList{position:static;transform:none;width:100%;flex:1;min-height:0;padding-top:0;background:#0a0e1a;backdrop-filter:none}
#sStat{width:100%;height:56.25vw}
#bar{padding:8px;gap:6px;left:8px;right:8px;bottom:8px}#info img{width:36px;height:36px}#btns button{min-width:54px;height:46px}
#player:fullscreen #stage{position:absolute;inset:0;aspect-ratio:auto;width:auto}
#player:fullscreen #sList{position:absolute;left:0;top:0;bottom:0;width:min(340px,86vw);flex:none;transform:translateX(-100%);background:#0a0e1af2}
#player:fullscreen #sList.on{transform:none}
}
#home{max-width:720px}h1{font-size:40px}
.big{position:relative;overflow:hidden;color:var(--tx);font-size:17px;font-weight:600;min-height:136px;justify-content:space-between;padding:18px;border-radius:20px;background:linear-gradient(160deg,rgba(30,48,92,.8),rgba(13,23,46,.8));box-shadow:0 10px 30px rgba(0,0,0,.35)}
.big::after{content:"";position:absolute;right:-44px;top:-44px;width:130px;height:130px;border-radius:50%;background:radial-gradient(rgba(91,140,255,.35),transparent 70%);pointer-events:none}
.big:hover,.big:focus-visible{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac),0 12px 34px rgba(91,140,255,.25);outline:0}
.big em{font-weight:400}
.h{border-radius:14px;background:linear-gradient(160deg,rgba(26,42,80,.7),rgba(13,23,46,.7))}
.tag{background:rgba(91,140,255,.22);color:#b4c8ff}
dialog{background:#0e1830}
#title{justify-content:flex-start;gap:12px}
.inf{display:flex;align-items:center;gap:12px;min-width:0}.inf img{width:42px;height:42px;border-radius:12px;background:#ffffff1a;object-fit:contain}
.bd{display:inline-block;margin:4px 6px 0 0;padding:1px 9px;border-radius:8px;background:rgba(91,140,255,.24);color:#b4c8ff;font-size:12px}
#browse{display:none;flex-direction:column;height:100%}#browse.on{display:flex}
#browse header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--ln);background:var(--sf);backdrop-filter:blur(14px)}
#browse header input{flex:1;max-width:420px;margin-left:auto;padding:10px 14px;border-radius:12px;border:1px solid var(--ln);background:var(--bg);color:var(--tx)}
.bd2{display:flex;flex:1;min-height:0}
#cats{width:250px;flex:none;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:4px;border-right:1px solid var(--ln)}
.ct{display:flex;justify-content:space-between;gap:8px;padding:10px 12px;border-radius:12px;background:none;border:0;cursor:pointer;text-align:left;color:var(--tx)}
.ct span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ct small{color:var(--mu)}.ct.on{background:rgba(91,140,255,.18);color:var(--ac)}
#rows{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.rw{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:var(--sf);border:1px solid var(--ln);cursor:pointer;flex:none}
.rw:hover{border-color:var(--ac)}.rw img{width:44px;height:44px;border-radius:12px;object-fit:contain;background:#ffffff14;flex:none}
.rw div{flex:1;min-width:0}.rw b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rw small{color:var(--mu)}
@media(max-width:700px){.bd2{flex-direction:column}#cats{width:auto;flex-direction:row;overflow-x:auto;overflow-y:hidden;border-right:0;border-bottom:1px solid var(--ln);padding:8px 12px}.ct{white-space:nowrap;flex:none}#browse header input{max-width:none}}
</style></head><body>
<div id="home">
<h1>Go<b>-</b>TV</h1><p class="sub">Open a playlist and start watching.</p>
<div class="grid">
<button class="big" id="bFile"><span>📁</span>Open file<em>M3U / M3U8 on this device</em></button>
<button class="big" id="bM3u"><span>🔗</span>M3U link<em>Playlist URL</em></button>
<button class="big" id="bSt"><span>📡</span>Stalker<em>Portal and MAC</em></button>
<button class="big" id="bXt"><span>⚡</span>Xtream<em>Server, user, password</em></button>
</div>
<h2>Recent</h2><div class="hist" id="hist"></div>
<div id="err"></div>
</div>
<div id="browse"><header><button class="gh" id="bb" title="Back">←</button><b>Go-TV</b><input id="bq" placeholder="Search channels"></header><div class="bd2"><aside id="cats"></aside><main id="rows"></main></div></div>
<input type="file" id="file" accept=".m3u,.m3u8,.txt" hidden>
<dialog id="dM3u"><label>Playlist URL</label><input id="m3u" placeholder="https://example.com/list.m3u or short link"><label>CORS proxy prefix (optional)</label><input id="prx" placeholder="https://your-proxy.example/?url="><div><button class="pri" data-go="m3u">Load</button> <button class="gh" data-x>Cancel</button></div></dialog>
<dialog id="dSt"><label>Portal URL</label><input id="stU" placeholder="http://portal.example.com/c"><label>MAC address</label><input id="stM" placeholder="00:1A:79:XX:XX:XX"><div><button class="pri" data-go="st">Connect</button> <button class="gh" data-x>Cancel</button></div></dialog>
<dialog id="dXt"><label>Server</label><input id="xS" placeholder="http://host:8080"><label>Username</label><input id="xU"><label>Password</label><input id="xP" type="password"><div><button class="pri" data-go="xt">Connect</button> <button class="gh" data-x>Cancel</button></div></dialog>

<div id="player"><div id="stage">
<video id="v" playsinline autoplay></video><div id="fl"></div><div id="gest"></div><div id="hud"></div>
<div id="title" class="hide"><button id="back" title="Back">←</button><span class="bd" id="q2"></span></div>
<div id="bar" class="hide"><div id="info"><img id="lg" alt="" hidden><div class="im"><div><span class="bd" id="cn"></span><span class="bd" id="bd"></span><b id="nm"></b></div><div id="epg">No guide data</div></div></div><div id="btns">
<button id="pv" title="Previous">⏮</button><button id="pp" title="Play/Pause">⏸</button><button id="st" title="Stop">⏹</button><button id="nx" title="Next">⏭</button>
<button id="fv" title="Favourite">★</button><button id="sb" title="Subtitles">CC</button><button id="au" title="Audio">🔈</button><button id="cp" title="Copy link">🔗</button><button id="vl" title="External">↗</button><button id="rc" title="Record">⏺</button><button id="dl" title="Download">⬇</button><button id="fs" title="Fullscreen">⛶</button></div></div>
</div><div class="side" id="sList"><input id="q" placeholder="Search channels"><div id="lst"></div></div>
<dialog id="dSave"><label>File name</label><input id="dsN"><div id="dsNote" style="font-size:12px;color:var(--mu);margin-bottom:12px"></div><div><button class="pri" id="dsGo">Save</button> <button class="gh" id="dsX">Cancel</button></div></dialog>
<div class="side" id="sStat"><dl id="stat"></dl></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.js"></script>
<script>
const $=s=>document.querySelector(s),v=$('#v');
let chs=[],cur=-1,hls=null,mp=null,fav=new Set(),open=new Set(),bright=1,subI=-1;
const ls={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,x){try{localStorage.setItem(k,JSON.stringify(x))}catch(e){}}};
fav=new Set(ls.get('gotv-fav',[]));
const err=m=>$('#err').textContent=m||'';
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('gotv',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function fput(k,t){try{const d=await idb();d.transaction('f','readwrite').objectStore('f').put(t,k)}catch(e){}}
async function fget(k){try{const d=await idb();return await new Promise((res,rej)=>{const r=d.transaction('f').objectStore('f').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej()})}catch(e){return null}}
/* ---------- history ---------- */
function addHist(h){let a=ls.get('gotv-hist',[]).filter(x=>x.key!==h.key);a.unshift(h);ls.set('gotv-hist',a.slice(0,8));renderHist()}
function renderHist(){const a=ls.get('gotv-hist',[]),el=$('#hist');el.innerHTML='';
 if(!a.length){el.innerHTML='<small style="color:var(--mu)">Nothing yet. Your playlists will show up here.</small>';return}
 a.forEach(h=>{const b=document.createElement('div');b.className='h';b.innerHTML='<span class="tag">'+h.type+'</span><div><b></b><small></small></div><button class="x" title="Remove">✕</button>';
  b.querySelector('b').textContent=h.name;b.querySelector('small').textContent=h.sub||'';
  b.onclick=e=>{if(e.target.classList.contains('x')){ls.set('gotv-hist',ls.get('gotv-hist',[]).filter(x=>x.key!==h.key));renderHist();return}
   if(h.type==='file'){fget(h.key).then(t=>{if(!t){$('#file').click();return}chs=parseM3U(t);showList()});return}run(h)};el.appendChild(b)})}
async function run(h){err('Loading…');try{
 if(h.type==='m3u')chs=parseM3U(await (await fetch(h.proxy?h.proxy+encodeURIComponent(h.url):h.url)).text());
 else if(h.type==='xtream')chs=await loadXtream(h);
 else if(h.type==='stalker')chs=await loadStalker(h);
 if(!chs.length)throw new Error('No channels found.');addHist(h);err('');showList()}
 catch(e){err(h.type==='stalker'?'Stalker portals need a MAC cookie that browsers cannot send, so Go-TV cannot connect to them directly. Convert the portal to an M3U playlist with another tool, then use Open file.':'Could not load: '+e.message+'. Remote servers often block browser requests (CORS); try the file option or host Go-TV yourself behind a proxy.')}}
/* ---------- loaders ---------- */
function parseM3U(t){const out=[];let m=null;
 t.split(/\r?\n/).forEach(l=>{l=l.trim();if(l.startsWith('#EXTM3U')){const u=/(?:url-tvg|x-tvg-url)="([^"]*)"/.exec(l);tvgUrl=u?u[1].split(',')[0]:'';epgOn=false;epgD={}}if(l.startsWith('#EXTINF')){const g=/group-title="([^"]*)"/.exec(l),lg=/tvg-logo="([^"]*)"/.exec(l),ti=/tvg-id="([^"]*)"/.exec(l);m={tid:ti&&ti[1],name:l.split(',').pop().trim()||'Channel',group:(g&&g[1])||'Ungrouped',logo:lg&&lg[1]}}
  else if(l&&!l.startsWith('#')){out.push({...(m||{name:l,group:'Ungrouped'}),url:l});m=null}});return out}
async function loadXtream(h){const b=h.server.replace(/\/$/,''),api=b+'/player_api.php?username='+encodeURIComponent(h.user)+'&password='+encodeURIComponent(h.pass);
 const [c,s]=await Promise.all([fetch(api+'&action=get_live_categories').then(r=>r.json()),fetch(api+'&action=get_live_streams').then(r=>r.json())]);
 const cm={};xtApi=api;c.forEach(x=>cm[x.category_id]=x.category_name);
 return s.map(x=>({sid:x.stream_id,tid:x.epg_channel_id,name:x.name,group:cm[x.category_id]||'Ungrouped',logo:x.stream_icon,url:b+'/live/'+h.user+'/'+h.pass+'/'+x.stream_id+'.m3u8'}))}
async function loadStalker(h){const base=h.portal.replace(/\/c\/?$/,'').replace(/\/$/,''),api=base+'/server/load.php',H={'X-User-Agent':'Model: MAG250; Link: WiFi'};
 const hs=await fetch(api+'?type=stb&action=handshake&JsHttpRequest=1-xml',{headers:H}).then(r=>r.json());
 const tk=hs.js.token;H.Authorization='Bearer '+tk;
 const gj=await fetch(api+'?type=itv&action=get_genres&JsHttpRequest=1-xml',{headers:H}).then(r=>r.json()),gm={};
 (gj.js||[]).forEach(g=>gm[g.id]=g.title);
 const cj=await fetch(api+'?type=itv&action=get_all_channels&JsHttpRequest=1-xml',{headers:H}).then(r=>r.json());
 return cj.js.data.map(c=>({name:c.name,group:gm[c.tv_genre_id]||'Ungrouped',logo:c.logo,cmd:c.cmd,url:null,
  resolve:async()=>{const r=await fetch(api+'?type=itv&action=create_link&cmd='+encodeURIComponent(c.cmd)+'&JsHttpRequest=1-xml',{headers:H}).then(r=>r.json());return r.js.cmd.replace(/^ffmpeg /,'')}}))}
/* ---------- home buttons ---------- */
$('#bFile').onclick=()=>$('#file').click();
$('#file').onchange=async e=>{const f=e.target.files[0];if(!f)return;const t=await f.text();chs=parseM3U(t);fput('file:'+f.name,t);
 if(!chs.length){err('No channels found in that file.');return}addHist({type:'file',key:'file:'+f.name,name:f.name,sub:'Saved in this browser'});err('');showList()};
$('#bM3u').onclick=()=>$('#dM3u').showModal();$('#bSt').onclick=()=>$('#dSt').showModal();$('#bXt').onclick=()=>$('#dXt').showModal();
document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>b.closest('dialog').close());
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{const d=b.closest('dialog'),k=b.dataset.go;let h;
 if(k==='m3u'){const u=$('#m3u').value.trim();if(!u)return;h={type:'m3u',key:'m3u:'+u,name:u.split('/').pop().split('?')[0]||u,sub:u,url:u,proxy:$('#prx').value.trim()}}
 if(k==='st'){const p=$('#stU').value.trim(),m=$('#stM').value.trim();if(!p)return;h={type:'stalker',key:'st:'+p+m,name:p.replace(/^https?:\/\//,''),sub:m,portal:p,mac:m}}
 if(k==='xt'){const s=$('#xS').value.trim(),u=$('#xU').value.trim(),p=$('#xP').value;if(!s)return;h={type:'xtream',key:'xt:'+s+u,name:s.replace(/^https?:\/\//,''),sub:u,server:s,user:u,pass:p}}
 d.close();run(h)});
/* ---------- player ---------- */
function showList(){$('#home').style.display='none';$('#browse').classList.add('on');renderBrowse()}
function renderList(){const q=$('#q').value.toLowerCase(),g={},el=$('#lst');el.innerHTML='';
 chs.forEach((c,i)=>{if(q&&!c.name.toLowerCase().includes(q))return;(g[c.group]=g[c.group]||[]).push(i);if(fav.has(c.name)){(g['★ Favourites']=g['★ Favourites']||[]).push(i)}});
 Object.keys(g).sort((a,b)=>a.startsWith('★')?-1:b.startsWith('★')?1:a.localeCompare(b)).forEach(n=>{const o=open.has(n)||!!q,h=document.createElement('button');h.className='gr';
  h.innerHTML='<span></span><span>'+(o?'▾':'▸')+' '+g[n].length+'</span>';h.firstChild.textContent=n;h.onclick=()=>{open.has(n)?open.delete(n):open.add(n);renderList()};el.appendChild(h);
  if(o)g[n].forEach(i=>{const b=document.createElement('button');b.className='ch'+(i===cur?' cur':'');b.textContent=String(i+1).padStart(2,'0')+'  '+chs[i].name;b.onclick=()=>play(i);el.appendChild(b)})})}
$('#q').oninput=renderList;
async function play(i){if(!chs.length)return;cur=(i+chs.length)%chs.length;const c=chs[cur];
 if(!c.url&&c.resolve){try{c.url=await c.resolve()}catch(e){hud('Link failed');return}}
 $('#nm').textContent=c.name;$('#cn').textContent='Channel '+(cur+1);$('#bd').textContent=c.group;$('#q2').textContent='';{const lg=$('#lg');lg.hidden=!c.logo;if(c.logo)lg.src=c.logo}epg(c);subI=-1;if(hls){hls.destroy();hls=null}if(mp){try{mp.destroy()}catch(e){}mp=null}
 log=[];start(c.url,order(c.url));


 v.play().catch(()=>{});if(rec)rec.stop();$('#player').classList.add('on');side();ui();
 open.add(c.group);hud(c.name);renderList();{const k=document.querySelector('#lst .cur');if(k)k.scrollIntoView({block:'center'})}upFav()}
let wd,att=0,log=[];
function order(u){const l=u.toLowerCase(),a=/m3u8/.test(l)?['hls']:/\.flv/.test(l)?['flv']:/\.(mp4|webm|ogg|mov|m4v)(\?|$)/.test(l)?['native']:['ts'];return[...new Set([...a,'hls','ts','flv','native'])]}
function kill(){if(hls){hls.destroy();hls=null}if(mp){try{mp.destroy()}catch(e){}mp=null}v.removeAttribute('src');v.load()}
function start(u,L){kill();const e=L.shift();if(!e){hud('Could not play: '+log.join(' | ')+'. Try VLC.',7000);return}
 const id=++att,fail=m=>{if(id!==att)return;log.push(e+': '+m);console.warn(e,m);hud(e+' failed ('+m+'), trying next…');start(u,L)};
 clearTimeout(wd);wd=setTimeout(()=>fail('timeout'),12000);
 v.onplaying=()=>{if(id===att){clearTimeout(wd);hud('Playing via '+e)}};v.onerror=()=>fail('media error');
 if(e==='hls'&&window.Hls&&Hls.isSupported()){hls=new Hls();hls.loadSource(u);hls.attachMedia(v);hls.on(Hls.Events.ERROR,(_,d)=>{if(d.fatal)fail(d.details||d.type)});v.play().catch(()=>{})}
 else if((e==='ts'||e==='flv')&&window.mpegts&&mpegts.getFeatureList().mseLivePlayback){mp=mpegts.createPlayer({type:e==='ts'?'mpegts':'flv',isLive:true,url:u});mp.attachMediaElement(v);mp.load();mp.on(mpegts.Events.ERROR,(t,x)=>fail(x));v.play().catch(()=>{})}
 else if(e==='native'){v.src=u;v.play().catch(()=>{})}
 else fail('unsupported')}
$('#vl').onclick=()=>{const c=chs[cur];if(!c||!c.url)return;const i=c.url.indexOf('://'),sc=c.url.slice(0,i),rest=c.url.slice(i+3);
 if(/android/i.test(navigator.userAgent))location.href='intent://'+rest+'#Intent;scheme='+sc+';action=android.intent.action.VIEW;type=video/*;end';
 else $('#cp').click()};
function upFav(){const c=chs[cur];$('#fv').classList.toggle('on',!!c&&fav.has(c.name))}
let ht;function hud(t,ms){const h=$('#hud');h.textContent=t;h.style.display='block';clearTimeout(ht);ht=setTimeout(()=>h.style.display='none',ms||1100)}
function ui(on){const s=on??$('#bar').classList.contains('hide');$('#bar').classList.toggle('hide',!s);$('#title').classList.toggle('hide',!s)}

let st;function stats(){const l=hls&&hls.levels&&hls.levels[hls.currentLevel],q=v.getVideoPlaybackQuality?v.getVideoPlaybackQuality():{},b=v.buffered.length?(v.buffered.end(v.buffered.length-1)-v.currentTime).toFixed(1):'0';
 const r=[['Channel',chs[cur]?.name||'-'],['Resolution',v.videoWidth?v.videoWidth+'×'+v.videoHeight:'-'],['Bitrate',l?Math.round(l.bitrate/1000)+' kbps':'-'],['Buffer',b+' s'],['Dropped',(q.droppedVideoFrames||0)+' frames'],['Volume',Math.round(v.volume*100)+'%'],['Brightness',Math.round(bright*100)+'%']];
 $('#stat').innerHTML=r.map(x=>'<dt>'+x[0]+'</dt><dd></dd>').join('');$('#stat').querySelectorAll('dd').forEach((d,i)=>d.textContent=r[i][1])}
setInterval(()=>{if($('#sStat').classList.contains('on'))stats()},1000);
$('#pv').onclick=()=>play(cur-1);$('#nx').onclick=()=>play(cur+1);

v.onplay=()=>$('#pp').textContent='⏸';v.onpause=()=>$('#pp').textContent='▶';
$('#st').onclick=()=>{if(hls){hls.destroy();hls=null}if(mp){try{mp.destroy()}catch(e){}mp=null}v.removeAttribute('src');v.load();$('#pp').textContent='▶';hud('Stopped');side('sList')};
$('#fv').onclick=()=>{const c=chs[cur];if(!c)return;fav.has(c.name)?fav.delete(c.name):fav.add(c.name);ls.set('gotv-fav',[...fav]);upFav();renderList();hud(fav.has(c.name)?'Added to favourites':'Removed')};
$('#sb').onclick=()=>{const t=hls&&hls.subtitleTracks.length?hls.subtitleTracks:null,n=t?t.length:v.textTracks.length;if(!n){hud('No subtitles');return}
 subI=subI+1>=n?-1:subI+1;if(t)hls.subtitleTrack=subI;else[...v.textTracks].forEach((x,i)=>x.mode=i===subI?'showing':'hidden');hud(subI<0?'Subtitles off':'Subtitle '+(subI+1)+'/'+n)};
$('#au').onclick=()=>{if(hls&&hls.audioTracks.length>1){hls.audioTrack=(hls.audioTrack+1)%hls.audioTracks.length;hud('Audio '+(hls.audioTrack+1)+'/'+hls.audioTracks.length)}
 else if(v.audioTracks&&v.audioTracks.length>1){const a=[...v.audioTracks],i=a.findIndex(x=>x.enabled);a.forEach((x,j)=>x.enabled=j===(i+1)%a.length);hud('Audio track changed')}else hud('Single audio track')};
$('#cp').onclick=async()=>{const u=chs[cur]&&chs[cur].url;if(!u)return;let ok=false;try{await navigator.clipboard.writeText(u);ok=true}catch(e){}
 if(!ok){const t=document.createElement('textarea');t.value=u;t.style.cssText='position:fixed;top:0;left:0;opacity:0';$('#player').appendChild(t);t.focus();t.select();try{ok=document.execCommand('copy')}catch(e){}t.remove()}
 if(ok)hud('Link copied');else prompt('Copy this link:',u)};
$('#back').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();if(rec){rec.stop();return}kill();$('#player').classList.remove('on');renderBrowse()};
/* ---------- gestures ---------- */
const g=$('#gest');let d=null;
g.addEventListener('pointerdown',e=>{g.setPointerCapture(e.pointerId);const w=innerWidth,z=e.clientX<w*.15?'L':e.clientX>w*.85?'R':'C';d={z,x:e.clientX,y:e.clientY,ly:e.clientY,mv:false}});
g.addEventListener('pointermove',e=>{if(!d)return;const dy=e.clientY-d.ly;if(Math.abs(e.clientY-d.y)>12||Math.abs(e.clientX-d.x)>12)d.mv=true;if(!d.mv)return;
 if(d.z==='L'){bright=Math.min(1.6,Math.max(.2,bright-dy/400));v.style.filter='brightness('+bright+')';hud('☀ '+Math.round(bright*100)+'%')}
 if(d.z==='R'){v.volume=Math.min(1,Math.max(0,v.volume-dy/300));v.muted=false;hud('🔊 '+Math.round(v.volume*100)+'%')}
 d.ly=e.clientY});
g.addEventListener('pointerup',e=>{if(!d)return;const z=d.z,dy=e.clientY-d.y,dx=e.clientX-d.x;
 if(!d.mv){const open=$('#sList').classList.contains('on')||$('#sStat').classList.contains('on');
  if(open)side();else if(z==='L')play(cur-1);else if(z==='R')play(cur+1);else ui()}
 else if(z==='C'&&Math.abs(dy)>50&&Math.abs(dy)>Math.abs(dx)){if(dy>0){side('sList');ui(false)}else{stats();side('sStat');ui(false)}}
 d=null});
let tvgUrl='',xtApi='',epgD={},epgOn=false;
const xd=s=>{if(!s||s.length<14)return 0;const z=(s.slice(15)||'+0000').trim();return Date.parse(s.slice(0,4)+'-'+s.slice(4,6)+'-'+s.slice(6,8)+'T'+s.slice(8,10)+':'+s.slice(10,12)+':'+s.slice(12,14)+z.slice(0,3)+':'+z.slice(3,5))};
function parseXT(t){try{new DOMParser().parseFromString(t,'text/xml').querySelectorAll('programme').forEach(p=>{const k=p.getAttribute('channel'),ti=p.querySelector('title');(epgD[k]=epgD[k]||[]).push({s:xd(p.getAttribute('start')),e:xd(p.getAttribute('stop')),t:ti?ti.textContent:''})})}catch(e){}}
async function loadEpg(){if(epgOn||!tvgUrl)return;epgOn=true;try{const r=await fetch(tvgUrl);let t;if(tvgUrl.split('?')[0].endsWith('.gz')&&window.DecompressionStream)t=await new Response(r.body.pipeThrough(new DecompressionStream('gzip'))).text();else t=await r.text();parseXT(t);showEpg()}catch(e){epgOn=false}}
async function xEpg(c){try{const j=await fetch(xtApi+'&action=get_short_epg&stream_id='+c.sid+'&limit=3').then(r=>r.json());c.ep=(j.epg_listings||[]).map(p=>({s:p.start_timestamp*1000,e:p.stop_timestamp*1000,t:new TextDecoder().decode(Uint8Array.from(atob(p.title),h=>h.charCodeAt(0)))}))}catch(e){}showEpg()}
function showEpg(){const c=chs[cur],el=$('#epg');if(!c)return;const L=c.ep||epgD[c.tid]||[],n=Date.now(),p=L.find(x=>x.s<=n&&n<x.e);
 if(!p){el.textContent='No guide data';return}
 const nx=L.filter(x=>x.s>=p.e).sort((a,b)=>a.s-b.s)[0],pc=Math.min(100,Math.max(0,(n-p.s)/(p.e-p.s)*100)),f=t=>new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
 el.innerHTML='<span></span><i><u></u></i>';el.firstChild.textContent='Now: '+p.t+' ('+f(p.s)+' - '+f(p.e)+')'+(nx?'   Next: '+nx.t:'');el.querySelector('u').style.width=pc+'%'}
function epg(c){$('#epg').textContent='No guide data';if(c.sid&&xtApi&&!c.ep)xEpg(c);else if(c.ep||tvgUrl){if(epgOn||c.ep)showEpg();else loadEpg()}}
setInterval(()=>{if(cur>=0)showEpg()},30000);
$('#lg').onerror=()=>{$('#lg').hidden=true};
let job=null,rec=null,rch=[],ri=null;
function askSave(name,fn,extra){job=fn;$('#dsN').value=name;$('#dsNote').textContent=(window.showSaveFilePicker?'You will choose the folder after Save.':'Saves to your browser Downloads folder. In Chrome settings > Downloads, turn on Ask where to save to pick a folder.')+(extra?' '+extra:'');$('#dSave').showModal()}
$('#dsGo').onclick=async()=>{const n=$('#dsN').value.trim()||'go-tv',f=job;$('#dSave').close();try{await f(n)}catch(e){if(!e||e.name!=='AbortError')hud('Save failed: '+(e&&e.message||e),4000)}};
$('#dsX').onclick=()=>{job=null;$('#dSave').close()};
async function saveBlob(b,n){if(window.showSaveFilePicker){const h=await showSaveFilePicker({suggestedName:n}),w=await h.createWritable();await w.write(b);await w.close();hud('Saved '+h.name,3000)}
 else{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;$('#player').appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),60000);hud('Saved to Downloads',3000)}}
async function dlUrl(u,name){let h=null;if(window.showSaveFilePicker)h=await showSaveFilePicker({suggestedName:name});
 hud('Downloading…',60000);
 try{const r=await fetch(u);if(!r.ok)throw new Error('HTTP '+r.status);
  if(h){const w=await h.createWritable();await r.body.pipeTo(w);hud('Saved '+h.name,3000)}else await saveBlob(await r.blob(),name)}
 catch(e){const a=document.createElement('a');a.href=u;a.download=name;$('#player').appendChild(a);a.click();a.remove();hud('Server blocks in-page download, handed to the browser',4000)}}
$('#fs').onclick=()=>{const p=$('#player');document.fullscreenElement?document.exitFullscreen():p.requestFullscreen?p.requestFullscreen():hud('Fullscreen not supported')};
$('#dl').onclick=()=>{const c=chs[cur];if(!c||!c.url)return;const ex=c.url.split('?')[0].split('.').pop().toLowerCase();
 if(!['mp4','mkv','avi','mov','m4v','webm'].includes(ex)){hud('Download is for movies and series. Use Record for live TV.',3500);return}
 askSave(c.name.replace(/[^a-z0-9]+/gi,'_')+'.'+ex,n=>dlUrl(c.url,n))};
$('#rc').onclick=()=>{if(rec){rec.stop();return}
 if(!(v.captureStream||v.mozCaptureStream)||!window.MediaRecorder){hud('Recording not supported here');return}
 const mt=['video/mp4;codecs=avc1,mp4a.40.2','video/webm;codecs=vp9,opus','video/webm'].find(t=>MediaRecorder.isTypeSupported(t));
 if(!mt){hud('Recording not supported here');return}
 const ex=mt.startsWith('video/mp4')?'mp4':'webm',nm=(chs[cur]?chs[cur].name:'recording').replace(/[^a-z0-9]+/gi,'_');rch=[];
 try{rec=new MediaRecorder((v.captureStream||v.mozCaptureStream).call(v),{mimeType:mt})}catch(e){rec=null;hud('Cannot record this stream');return}
 rec.ondataavailable=e=>{if(e.data.size)rch.push(e.data)};
 rec.onstop=()=>{clearInterval(ri);$('#rc').textContent='⏺';$('#rc').classList.remove('on');const b=new Blob(rch,{type:mt.split(';')[0]});rec=null;rch=[];
  askSave(nm+'_'+new Date().toISOString().slice(0,16).replace(/[:T]/g,'-')+'.'+ex,n=>saveBlob(b,n),'Cancel discards the recording.')};
 const t0=Date.now();rec.start(1000);$('#rc').classList.add('on');$('#rc').textContent='0:00';
 ri=setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000);$('#rc').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')},1000);hud('Recording started')};
let cat='*',lim=200;
function renderBrowse(){const q=$('#bq').value.toLowerCase(),g={},re=$('#rows'),st=re.scrollTop;
 chs.forEach(c=>{g[c.group]=(g[c.group]||0)+1});
 const L=[['★','★ Favourites',chs.filter(c=>fav.has(c.name)).length],['*','All channels',chs.length],...Object.keys(g).sort().map(k=>[k,k,g[k]])],ce=$('#cats');ce.innerHTML='';
 L.forEach(([k,n,c])=>{const b=document.createElement('button');b.className='ct'+(k===cat?' on':'');b.innerHTML='<span></span><small>'+c+'</small>';b.firstChild.textContent=n;b.onclick=()=>{cat=k;lim=200;renderBrowse();$('#rows').scrollTop=0};ce.appendChild(b)});
 const idx=[];chs.forEach((c,i)=>{if(q&&!c.name.toLowerCase().includes(q))return;if(cat==='★'?!fav.has(c.name):cat!=='*'&&c.group!==cat)return;idx.push(i)});
 re.innerHTML='';
 idx.slice(0,lim).forEach(i=>{const c=chs[i],r=document.createElement('div');r.className='rw';
  r.innerHTML='<img loading="lazy" alt=""><div><b></b><small></small></div><button class="x"></button>';
  const im=r.querySelector('img');if(c.logo)im.src=c.logo;else im.style.visibility='hidden';im.onerror=()=>im.style.visibility='hidden';
  r.querySelector('b').textContent=String(i+1).padStart(2,'0')+'  '+c.name;r.querySelector('small').textContent=c.group;
  const s=r.querySelector('.x');s.textContent=fav.has(c.name)?'★':'☆';s.onclick=e=>{e.stopPropagation();fav.has(c.name)?fav.delete(c.name):fav.add(c.name);ls.set('gotv-fav',[...fav]);renderBrowse()};
  r.onclick=()=>play(i);re.appendChild(r)});
 if(idx.length>lim){const m=document.createElement('button');m.className='pri';m.textContent='Show more ('+(idx.length-lim)+')';m.onclick=()=>{lim+=300;renderBrowse()};re.appendChild(m)}
 if(!idx.length)re.innerHTML='<p style="color:var(--mu)">No channels here yet. Star a channel to add it to Favourites.</p>';
 re.scrollTop=st}
$('#bq').oninput=()=>{lim=200;renderBrowse()};
